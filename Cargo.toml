[package]
name = "percy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["cargo", "derive", "env"] }
owo-colors = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serenity = "0.12.5"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "1.1.4"
